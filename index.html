<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediksi Bola WDBOS - Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:wght@700;900&display=swap"
        rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Playfair+Display:wght@700;900&display=swap');

        :root {
            --bg-deep: #060b18;
            --glass-bg: rgba(15, 23, 42, 0.8);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-glow: #3b82f6;
            --accent-yellow: #c3ed07;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --card-bg: #ffffff;
            --card-text: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg-deep);
            background-image:
                radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(195, 237, 7, 0.03) 0%, transparent 40%);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1100px;
            padding: 60px 20px;
        }

        /* Branding Section */
        .branding-header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }

        .branding-header p {
            color: var(--accent-glow);
            text-transform: uppercase;
            letter-spacing: 0.4em;
            font-size: 0.7rem;
            font-weight: 800;
            margin-bottom: 12px;
            opacity: 0.9;
        }

        .branding-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.3rem, 7vw, 4rem);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(180deg, #fff 0%, rgba(255, 255, 255, 0.7) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            /* Disederhanakan untuk performa */
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .meta-info {
            display: flex;
            justify-content: center;
            gap: 25px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .meta-info span {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 14px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
        }

        /* Action Buttons */
        .action-flex {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-modern {
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: #fff;
            transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
        }

        .btn-modern:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .btn-modern.highlight {
            background: var(--accent-yellow);
            color: #000;
            border: none;
        }

        .btn-modern.highlight:hover {
            background: #e1ff00;
            box-shadow: 0 10px 30px rgba(195, 237, 7, 0.4);
        }

        /* Content Container */
        .content-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px 25px;
            backdrop-filter: blur(8px);
            /* Dikurangi untuk performa mobile */
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .content-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        }

        .top-meta {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 25px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        /* Marquee Section */
        .marquee-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .marquee-box p {
            color: var(--accent-yellow);
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: nowrap;
            display: inline-block;
            padding-left: 100%;
            animation: marquee-anim 12s linear infinite;
        }

        @keyframes marquee-anim {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-100%);
            }
        }

        /* Tables Premium Styling - Ultimate Luxury Version */
        .league-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-bottom: 40px;
            background: var(--card-bg);
            color: var(--card-text);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            table-layout: fixed;
            position: relative;
            /* Mengoptimalkan render pada scroll */
            contain: content;
        }

        .league-table th,
        .league-table td {
            text-align: center !important;
            vertical-align: middle !important;
        }

        .league-header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        .league-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--accent-yellow);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-shadow: none;
        }

        .league-name-header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #fff;
            padding: 20px !important;
            border: none !important;
        }

        .league-title-text {
            font-size: 1.15rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .col-header {
            background: #fcfdfe !important;
            color: #2563eb !important;
            font-weight: 900 !important;
            font-size: 0.8rem !important;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 16px !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.15) !important;
            border-right: 1px solid rgba(0, 0, 0, 0.05) !important;
        }

        .col-header:last-child {
            border-right: none !important;
        }

        .league-table td {
            padding: 15px 10px;
            font-weight: 600;
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            /* Garis hitam tipis horizontal */
            border-right: 1px solid rgba(0, 0, 0, 0.04);
            /* Garis hitam tipis vertikal */
            color: #334155;
            position: relative;
            word-break: break-word;
            /* Mencegah teks meluap */
        }

        .league-table td:last-child {
            border-right: none;
        }

        /* Match Scoreboard Layout - Luxury Sports Version */
        .match-cell-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        .team-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            /* Mencegah overflow flexbox */
        }

        .team-wrapper.home {
            flex-direction: row-reverse;
            text-align: right;
            justify-content: flex-start;
        }

        .team-wrapper.away {
            text-align: left;
            justify-content: flex-start;
        }

        .team-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            border: 1px solid #cbd5e1;
            color: #475569;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 900;
            flex-shrink: 0;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .team-name {
            flex: 1;
            font-weight: 700;
            font-size: 0.95rem;
            line-height: 1.2;
            color: #334155;
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .vs-badge {
            flex-shrink: 0;
            background: #f1f5f9;
            color: #94a3b8;
            font-size: 0.7rem;
            font-weight: 900;
            padding: 5px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            font-style: italic;
            border: 1px solid #e2e8f0;
            min-width: 45px;
            text-align: center;
        }

        .league-table tr {
            transition: background 0.2s, color 0.2s;
        }

        .league-table tr:hover td {
            background: #f8fafc;
            color: #1e293b;
        }

        .league-table tbody tr:hover {
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.02);
        }

        /* Hover Blue Accent Line */
        .league-table tbody tr td:first-child::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20%;
            bottom: 20%;
            width: 4px;
            background: #2563eb;
            border-radius: 0 4px 4px 0;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .league-table tbody tr:hover td:first-child::before {
            opacity: 1;
        }

        .score-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .score-box {
            background: #eff6ff;
            color: #2563eb;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 1.1rem;
            border: 1px solid #dbeafe;
            min-width: 45px;
            text-align: center;
        }

        .score-sep {
            color: #2563eb;
            font-weight: 900;
            opacity: 0.5;
        }

        .score-display {
            background: #eff6ff;
            color: #2563eb;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 1.1rem;
            border: 1px solid #dbeafe;
            display: inline-block;
            min-width: 60px;
        }

        /* SMART COLUMN SIZING - Dioptimalkan agar tidak terpotong */
        .date-col {
            width: 20% !important;
        }

        .match-col {
            width: 60% !important;
        }

        .score-col {
            width: 20% !important;
        }

        @media (max-width: 768px) {
            .main-wrapper {
                padding: 20px 10px;
            }

            .branding-header h1 {
                font-size: 1.8rem;
                letter-spacing: 1px;
            }

            .branding-header p {
                font-size: 0.8rem;
            }

            .meta-info {
                flex-wrap: wrap;
                gap: 10px;
                font-size: 0.7rem;
            }

            .content-container {
                padding: 20px 10px;
                border-radius: 15px;
            }

            .league-name-header {
                padding: 15px 10px !important;
            }

            .league-title-text {
                font-size: 0.9rem;
                letter-spacing: 1px;
            }

            .league-badge {
                font-size: 0.6rem;
                padding: 3px 8px;
            }

            .col-header {
                font-size: 0.6rem !important;
                white-space: nowrap;
                padding: 12px 2px !important;
                letter-spacing: 0;
            }

            /* Responsive Columns - SMART MOBILE LAYOUT */
            .date-col {
                width: 75px !important;
            }

            .match-col {
                width: auto !important;
            }

            .score-col {
                width: 70px !important;
            }

            .league-table td {
                padding: 12px 2px;
                font-size: 0.7rem;
                line-height: 1.2;
            }

            /* Stack Date & Time on Mobile */
            .league-table td:first-child {
                font-size: 0.65rem;
                color: #64748b;
                white-space: normal;
                word-spacing: 100vw;
                text-align: center !important;
            }

            .team-name {
                font-size: 0.7rem;
                font-weight: 700;
                line-height: 1.1;
                flex: 1;
                white-space: nowrap;
                font-size: 0.72rem;
                font-weight: 700;
                line-height: 1.1;
                white-space: normal;
                text-align: center;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                width: 100%;
            }

            .match-cell-content {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 5px;
                padding: 5px 0;
            }

            .team-wrapper {
                width: 100%;
                justify-content: center;
            }

            .team-name {
                font-size: 0.72rem;
                font-weight: 700;
                line-height: 1.1;
                white-space: normal;
                text-align: center;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                min-height: 1.1em;
            }

            .vs-badge {
                min-width: auto;
                width: fit-content;
                padding: 1px 8px;
                font-size: 0.5rem;
                margin: 2px 0;
                background: rgba(0, 0, 0, 0.05);
                color: #94a3b8;
                border-radius: 4px;
            }

            .score-container {
                flex-direction: column;
                gap: 5px;
                /* Sama dengan gap match-cell-content */
            }

            .score-box {
                padding: 4px 6px;
                font-size: 0.72rem;
                min-width: 45px;
            }

            .score-sep {
                font-size: 0.5rem;
                margin: 2px 0;
                opacity: 0.3;
                height: 12px;
                display: flex;
                align-items: center;
            }

            .score-display {
                padding: 6px 4px;
                font-size: 0.85rem;
                min-width: 50px;
                text-align: center;
                display: block;
                margin: 0 auto;
            }

            .team-icon {
                display: none !important;
            }
        }

        @media (max-width: 480px) {
            .date-col {
                width: 70px !important;
            }

            .score-col {
                width: 65px !important;
            }

            .league-title-text {
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body>

    <div class="main-wrapper">
        <div class="branding-header">
            <p>Prediksi Bola</p>
            <h1>PREDIKSI BOLA WDBOS</h1>
            <div class="meta-info">
                <span><i class="ph ph-user"></i> By WDBOS</span>
                <span><i class="ph ph-calendar-blank"></i> <span id="currentDateHeader">-</span></span>
                <span><i class="ph ph-clock"></i> <span id="lastUpdatedBadge">Menyingkronkan...</span></span>
                <span><i class="ph ph-star"></i> Sticky post</span>
            </div>
            <div style="margin-top: 15px; display: flex; justify-content: center; gap: 15px;">
                <button id="refreshBtnMain"
                    style="background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid #444; padding: 10px 20px; border-radius: 30px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s;">
                    <i class="ph-bold ph-arrows-clockwise" id="refreshIcon"></i> REFRESH DATA
                </button>
                <button id="copyBtn"
                    style="background: var(--accent-yellow); color: #000; border: none; padding: 10px 20px; border-radius: 30px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: transform 0.2s;">
                    <i class="ph-bold ph-copy" style="font-size: 1.2rem;"></i> SALIN SCRIPT JADWAL
                </button>
            </div>
        </div>

        <div class="content-container">
            <div class="top-meta" id="displayDateText">...</div>

            <div class="marquee-box" id="marqueeContainer">
                <p>SELAMAT DATANG DI PREDIKSI BOLA WDBOS! | SELALU UTAMAKAN PREDIKSI SENDIRI!</p>
            </div>

            <div id="dataContent">
                <!-- Tables will be injected here -->
                <div style="text-align: center; padding: 50px; color: #888;">
                    <i class="ph ph-spinner ph-spin" style="font-size: 2rem; margin-bottom: 10px; display: block;"></i>
                    Menyingkronkan Jadwal...
                </div>
            </div>
        </div>
    </div>


    <script>
        const CONFIG = {
            DATA_URL: 'https://shortq.xyz/prediksibola',
            PROXIES: [
                'https://corsproxy.io/?',
                'https://api.allorigins.win/raw?url=',
                'https://api.codetabs.com/v1/proxy?url=',
                'https://thingproxy.freeboard.io/fetch/'
            ],
            FETCH_TIMEOUT: 10000, // Menambah timeout untuk lingkungan Vercel
            POLLING_INTERVAL: 3600000,
            AUTO_REFRESH: false
        };

        // Data Cadangan (Hardcoded Fallback) agar Dashboard tidak pernah kosong di Vercel
        const FALLBACK_DATA = {
            title: "PREDIKSI BOLA 10-11 APRIL 2026",
            content: `
                <table class="league-table">
                    <thead>
                        <tr><th colspan="3" class="league-name-header"><div class="league-header-container"><span class="league-title-text"><i class="ph-fill ph-trophy"></i> ENGLISH PREMIER LEAGUE</span></div></th></tr>
                        <tr><th class="col-header date-col">Waktu</th><th class="col-header match-col">Pertandingan</th><th class="col-header score-col">Skor</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>11/04 02:00</td><td><div class="match-cell-content"><div class="team-wrapper home"><div class="team-icon">WH</div><span class="team-name">West Ham United</span></div><span class="vs-badge">VS</span><div class="team-wrapper away"><div class="team-icon">WW</div><span class="team-name">Wolverhampton Wanderers</span></div></div></td><td><div class="score-container"><span class="score-box">2</span><span class="score-sep">:</span><span class="score-box">1</span></div></td></tr>
                    </tbody>
                </table>
                <table class="league-table">
                    <thead>
                        <tr><th colspan="3" class="league-name-header"><div class="league-header-container"><span class="league-title-text"><i class="ph-fill ph-trophy"></i> ITALY SERIE A</span></div></th></tr>
                        <tr><th class="col-header date-col">Waktu</th><th class="col-header match-col">Pertandingan</th><th class="col-header score-col">Skor</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>11/04 01:45</td><td><div class="match-cell-content"><div class="team-wrapper home"><div class="team-icon">AR</div><span class="team-name">AS Roma</span></div><span class="vs-badge">VS</span><div class="team-wrapper away"><div class="team-icon">PS</div><span class="team-name">Pisa</span></div></div></td><td><div class="score-container"><span class="score-box">3</span><span class="score-sep">:</span><span class="score-box">0</span></div></td></tr>
                    </tbody>
                </table>
                <table class="league-table">
                    <thead>
                        <tr><th colspan="3" class="league-name-header"><div class="league-header-container"><span class="league-title-text"><i class="ph-fill ph-trophy"></i> SPAIN LA LIGA</span></div></th></tr>
                        <tr><th class="col-header date-col">Waktu</th><th class="col-header match-col">Pertandingan</th><th class="col-header score-col">Skor</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>11/04 02:00</td><td><div class="match-cell-content"><div class="team-wrapper home"><div class="team-icon">RM</div><span class="team-name">Real Madrid</span></div><span class="vs-badge">VS</span><div class="team-wrapper away"><div class="team-icon">GF</div><span class="team-name">Girona FC</span></div></div></td><td><div class="score-container"><span class="score-box">4</span><span class="score-sep">:</span><span class="score-box">1</span></div></td></tr>
                    </tbody>
                </table>
                <div style="text-align:center; padding:15px; color:#94a3b8; font-size:0.8rem;">
                    <i class="ph ph-info"></i> Menampilkan data snapshot terakhir. Klik REFRESH untuk update terbaru.
                </div>
            `
        };

        let lastDataHash = null;

        /**
         * Fungsi pembantu fetch dengan timeout agar tidak loading terlalu lama
         */
        async function fetchWithTimeout(resource, options = {}) {
            const { timeout = CONFIG.FETCH_TIMEOUT } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(resource, { ...options, signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (e) {
                clearTimeout(id);
                throw e;
            }
        }

        /**
         * Fungsi untuk mengambil dan memproses data secara otomatis dengan sistem Multi-Proxy Loop
         */
        async function updateDashboard(force = false) {
            const dataContent = document.getElementById('dataContent');
            const displayDateText = document.getElementById('displayDateText');
            const refreshIcon = document.getElementById('refreshIcon');
            
            if (refreshIcon) refreshIcon.classList.add('ph-spin');
            
            let success = false;
            let scheduleTitle = "PREDIKSI BOLA TERKINI";

            for (let i = 0; i < CONFIG.PROXIES.length; i++) {
                const proxy = CONFIG.PROXIES[i];
                if (!lastDataHash && displayDateText) displayDateText.innerText = `Menghubungkan Jalur ${i + 1}...`;

                try {
                    const url = proxy + encodeURIComponent(CONFIG.DATA_URL + '?t=' + Date.now());
                    const response = await fetchWithTimeout(url);
                    if (response.ok) {
                        const rawText = await response.text();
                        if (rawText && rawText.trim().length > 100) {
                            // Coba deteksi judul dari teks dengan regex yang lebih ketat (berhenti di tag HTML)
                            const titleMatch = rawText.match(/((?:JADWAL|PREDIKSI) BOLA\s+\d+[^<]*)/i);
                            if (titleMatch) {
                                scheduleTitle = titleMatch[1].replace(/<[^>]*>?/gm, '').trim().replace(/JADWAL BOLA/gi, 'PREDIKSI BOLA');
                            } else {
                                // Default title based on today
                                const now = new Date();
                                const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
                                const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
                                scheduleTitle = `PREDIKSI BOLA ${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
                            }

                            window.currentScheduleTitle = scheduleTitle;
                            processIncomingData(rawText);

                            if (displayDateText) displayDateText.innerText = scheduleTitle;
                            const dateHeader = document.getElementById('currentDateHeader');
                            if (dateHeader) dateHeader.innerText = scheduleTitle.replace(/PREDIKSI BOLA|JADWAL BOLA/gi, '').trim();

                            // Simpan ke Cache untuk Instant Load berikutnya
                            try {
                                const now = new Date();
                                const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';
                                localStorage.setItem('wdbos_last_data', rawText);
                                localStorage.setItem('wdbos_last_title', scheduleTitle);
                                localStorage.setItem('wdbos_last_hash', btoa(unescape(encodeURIComponent(rawText + scheduleTitle))).substring(0, 32));
                                localStorage.setItem('wdbos_last_update', timeStr);
                                
                                const updateBadge = document.getElementById('lastUpdatedBadge');
                                if (updateBadge) updateBadge.innerText = 'Update: ' + timeStr;
                            } catch (e) { console.warn("Gagal menyimpan cache:", e); }

                            lastDataHash = btoa(unescape(encodeURIComponent(rawText + scheduleTitle))).substring(0, 32);
                            success = true;
                            break;
                        }
                    }
                } catch (e) { console.warn(`Jalur ${i + 1} Gagal atau Timeout:`, e.message); }
            }

            if (refreshIcon) refreshIcon.classList.remove('ph-spin');
            
            if (!success && !lastDataHash) {
                // Tampilkan data fallback jika koneksi benar-benar gagal dan tidak ada cache
                displayDateText.innerText = FALLBACK_DATA.title;
                dataContent.innerHTML = FALLBACK_DATA.content;
                
                // Tambahkan peringatan kecil di bawah
                const errorAlert = document.createElement('div');
                errorAlert.style.textAlign = 'center';
                errorAlert.style.marginTop = '20px';
                errorAlert.style.color = '#ef4444';
                errorAlert.innerHTML = `<i class="ph ph-warning"></i> Sinkronisasi Gagal. Menampilkan data cadangan.`;
                dataContent.appendChild(errorAlert);
            } else if (!success && lastDataHash) {
                // Jika gagal tapi ada data lama, beri notifikasi kecil (opsional)
                console.log("Menampilkan data cache karena fetch gagal.");
            }
        }

        /**
         * Menangani data yang masuk (baik HTML snippet, JSON, atau Plain Text)
         */
        function processIncomingData(data) {
            if (!data || typeof data !== 'string' || data.trim().length < 50) return;

            try {
                // Coba JSON
                if (data.trim().startsWith('{') || data.trim().startsWith('[')) {
                    const jsonData = JSON.parse(data);
                    if (jsonData && jsonData.leagues) {
                        renderWithJSON(jsonData);
                        return;
                    }
                }
            } catch (e) {}
            
            // Jika bukan JSON, cek apakah HTML atau Plain Text
            if (data.includes('<table') || data.includes('<tr')) {
                renderWithHTMLSnippet(data);
            } else {
                renderWithPlainText(data);
            }
        }

        /**
         * GLOBAL UTILITIES FOR RENDERING
         */
        const cleanTeam = (t) => t.trim().replace(/\[\d+\]/g, '').replace(/\([nN]\)/g, '').replace(/\s*[\/\-]\s*\d+\s*$/, '').replace(/\s+/g, ' ').trim();
        const normalizeTime = (t) => t.trim().replace(/[\.\s]+/g, ':').replace(/(\d{2})[:\.](\d{2})/, '$1:$2').trim();
        
        // Membersihkan tanggal tampilan dari keterangan tambahan seperti WIB
        const cleanDisplayDate = (d) => d.replace(/WIB/gi, '').trim();

        const getInitials = (name) => {
            const words = name.split(' ');
            return words.length > 1 ? (words[0][0] + words[1][0]).toUpperCase() : name.substring(0, 2).toUpperCase();
        };

        const formatMatchText = (text) => {
            const parts = text.split(/\s+VS\s+/i);
            if (parts.length >= 2) {
                const homeTeam = cleanTeam(parts[0]);
                const awayTeam = cleanTeam(parts[1]);

                return `
                    <div class="match-cell-content">
                        <div class="team-wrapper home">
                            <div class="team-icon">${getInitials(homeTeam)}</div>
                            <span class="team-name">${homeTeam}</span>
                        </div>
                        <span class="vs-badge">VS</span>
                        <div class="team-wrapper away">
                            <div class="team-icon">${getInitials(awayTeam)}</div>
                            <span class="team-name">${awayTeam}</span>
                        </div>
                    </div>
                `;
            }
            return text;
        };

        const formatScoreText = (text) => {
            let raw = text.trim();

            // 1. Jika sudah format skor murni (misal: "1 : 2" atau "2-0")
            const pureScore = raw.match(/(\d+)\s*[:\-\u2013\u2014]\s*(\d+)/);
            if (pureScore) {
                return `<div class="score-container"><span class="score-box">${pureScore[1]}</span><span class="score-sep">:</span><span class="score-box">${pureScore[2]}</span></div>`;
            }

            // 2. Jika bukan format skor murni, anggap sebagai Handicap dan konversi ke Tebakan Skor yang bervariasi
            let val = raw.replace(/(\d+)\s+(\d+)\/(\d+)/g, (m, p1, p2, p3) => parseFloat(p1) + (parseInt(p2) / parseInt(p3)));
            val = val.replace(/(\d+)\/(\d+)/g, (m, p1, p2) => parseInt(p1) / parseInt(p2));

            const nums = val.match(/\d+(\.\d+)?/g);
            let s1 = 1, s2 = 0;

            if (nums) {
                const n = parseFloat(nums[0]), r = Math.random();
                if (n === 0) {
                    const p = [[0, 0], [1, 1], [2, 2], [1, 1]]; const c = p[Math.floor(r * p.length)]; s1 = c[0]; s2 = c[1];
                } else if (n <= 0.5) {
                    const p = [[1, 0], [2, 1], [1, 1], [0, 0]]; const c = p[Math.floor(r * p.length)]; s1 = c[0]; s2 = c[1];
                } else if (n <= 1.0) {
                    const p = [[2, 1], [2, 0], [1, 0], [3, 1]]; const c = p[Math.floor(r * p.length)]; s1 = c[0]; s2 = c[1];
                } else if (n <= 1.5) {
                    const p = [[2, 0], [3, 1], [3, 0], [2, 1]]; const c = p[Math.floor(r * p.length)]; s1 = c[0]; s2 = c[1];
                } else {
                    const p = [[3, 0], [3, 1], [4, 1], [4, 0]]; const c = p[Math.floor(r * p.length)]; s1 = c[0]; s2 = c[1];
                }

                const parts = val.split(/\s*[:\-\u2013\u2014]\s*/);
                if (parts.length === 2 && parseFloat(parts[1]) > parseFloat(parts[0])) {
                    [s1, s2] = [s2, s1];
                }
            } else {
                s1 = Math.floor(Math.random() * 4);
                s2 = Math.floor(Math.random() * 3);
            }

            return `<div class="score-container"><span class="score-box">${s1}</span><span class="score-sep">:</span><span class="score-box">${s2}</span></div>`;
        };

        function renderWithJSON(data) {
            document.getElementById('currentDateHeader').textContent = '-';
            document.getElementById('displayDateText').textContent = data.display_date || '';
            document.getElementById('marqueeContainer').innerHTML = `<p>${data.marquee_text || 'SELAMAT DATANG DI PREDIKSI BOLA WDBOS! | SELALU UTAMAKAN PREDIKSI SENDIRI!'}</p>`;

            let html = '';
            data.leagues.forEach(league => {

                        </tr>

                                <td>${cleanDisplayDate(m.time)}</td>
                                <td>${formatMatchText(m.teams)}</td>
                                <td>${formatScoreText(m.score)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>`;
            });
            document.getElementById('dataContent').innerHTML = html;
        }

        function renderWithPlainText(text) {
            const targetContainer = document.getElementById('dataContent');
            const lines = text.split('\n');
            let lastKnownLeague = "PREDIKSI BOLA TERKINI";
            const leagueMatches = {};
            const leagueOrder = [];
            const matchRegistry = new Set();

            // Regex for match lines: 11/04 02.00 WIB [18] West Ham United VS [20] Wolverhampton Wanderers 0 : 1/2
            const matchRegex = /(\d{1,2}\/\d{1,2}\s+\d{1,2}[:\.]\d{2})\s*(?:WIB)?\s+(.+?)\s+VS\s+(.+?)\s+([\d\/\.\s]+[:\-\u2013\u2014\s]+[\d\/\.]+)/i;

            lines.forEach(line => {
                const s = line.trim();
                if (!s) return;

                const m = s.match(matchRegex);
                if (m) {
                    const matchTime = m[1].trim();
                    const homeTeam = m[2].trim();
                    const awayTeam = m[3].trim();
                    const scoreText = m[4].trim();

                    const key = [homeTeam, awayTeam].sort().join('|') + '@' + normalizeTime(matchTime);
                    if (!matchRegistry.has(key)) {
                        matchRegistry.add(key);
                        if (!leagueMatches[lastKnownLeague]) {
                            leagueMatches[lastKnownLeague] = [];
                            leagueOrder.push(lastKnownLeague);
                        }
                        leagueMatches[lastKnownLeague].push(`<tr><td>${cleanDisplayDate(matchTime)}</td><td>${formatMatchText(homeTeam + ' VS ' + awayTeam)}</td><td>${formatScoreText(scoreText)}</td></tr>`);
                    }
                } else if (s.length > 3 && s.length < 60 && !s.toLowerCase().includes('vs') && !s.toUpperCase().includes('BOLA') && !/\d{1,2}\/\d{1,2}/.test(s)) {
                    lastKnownLeague = s.toUpperCase();
                }
            });

            renderLeagues(leagueOrder, leagueMatches, targetContainer);
        }

        function renderWithHTMLSnippet(htmlString) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');
            const targetContainer = document.getElementById('dataContent');

            doc.querySelectorAll('script, style, iframe, noscript, nav, header, footer').forEach(s => s.remove());

            const marqueeP = doc.querySelector('.marquee p, marquee');
            if (marqueeP) {
                document.getElementById('marqueeContainer').innerHTML = `<p>${marqueeP.textContent}</p>`;
            }

            const leagueMatches = {};
            const leagueOrder = [];
            const matchRegistry = new Set();

            const sourceTables = Array.from(doc.querySelectorAll('table')).filter(t => t.innerText.includes('VS'));

            if (sourceTables.length > 0) {
                sourceTables.forEach(table => {
                    const rows = Array.from(table.querySelectorAll('tr'));
                    let currentLeague = "JADWAL PERTANDINGAN";

                    rows.forEach((row, idx) => {
                        const cells = Array.from(row.querySelectorAll('td, th'));
                        if (cells.length === 3 && (cells[1].innerText.includes('VS') || cells[2].innerText.includes(':') || cells[2].innerText.includes('-'))) {
                            const matchTime = cells[0].innerText.trim();
                            const matchText = cells[1].innerText.trim();
                            const scoreText = cells[2].innerText.trim();

                            const teams = matchText.split(/\s+vs\s+/i).map(t => cleanTeam(t).toLowerCase()).sort();
                            const key = `${teams.join('|')}@${normalizeTime(matchTime)}`;

                            if (!matchRegistry.has(key)) {
                                matchRegistry.add(key);
                                if (!leagueMatches[currentLeague]) {
                                    leagueMatches[currentLeague] = [];
                                    leagueOrder.push(currentLeague);
                                }
                                leagueMatches[currentLeague].push(`<tr><td>${cleanDisplayDate(matchTime)}</td><td>${formatMatchText(matchText)}</td><td>${formatScoreText(scoreText)}</td></tr>`);
                            }
                        } else if (idx === 0 || cells.length === 1) {
                            const txt = row.textContent.trim().toUpperCase();
                            if (txt.length > 5 && !txt.includes('BOLA') && !txt.includes('DATE') && !txt.includes('TIME')) {
                                currentLeague = txt;
                            }
                        }
                    });
                });
            }

            if (leagueOrder.length === 0) {
                renderWithPlainText(doc.body.innerText || doc.body.textContent);
                return;
            }

            renderLeagues(leagueOrder, leagueMatches, targetContainer);
        }

        function renderLeagues(leagueOrder, leagueMatches, targetContainer) {
            targetContainer.innerHTML = '';
            leagueOrder.forEach(name => {
                const matches = leagueMatches[name];
                if (matches && matches.length > 0) {
                    const table = document.createElement('table');
                    table.className = 'league-table';
                    table.innerHTML = `
                        <thead>
                            <tr>
                                <th colspan="3" class="league-name-header">
                                    <div class="league-header-container">
                                        <span class="league-title-text"><i class="ph-fill ph-trophy"></i> ${name}</span>
                                        <span class="league-badge">${matches.length} MATCHES</span>
                                    </div>
                                </th>
                            </tr>
                            <tr>
                                <th class="col-header date-col">Tanggal & Waktu</th>
                                <th class="col-header match-col">Pertandingan</th>
                                <th class="col-header score-col">Prediksi Skor</th>
                            </tr>
                        </thead>
                        <tbody>${matches.join('')}</tbody>
                    `;
                    targetContainer.appendChild(table);
                }
            });

            if (leagueOrder.length === 0) {
                targetContainer.innerHTML = '<div style="text-align:center; padding:50px; color:#94a3b8;"><i class="ph ph-warning-circle" style="font-size:2.5rem; display:block; margin-bottom:10px;"></i>Data tidak ditemukan. Silakan cek link acuan.</div>';
            }
        }

        /**

         * Menggunakan !important agar tidak terpengaruh CSS dari website lain
         */
        function copyGeneratedScript() {

<script>

                    const sR = await fetch(p + encodeURIComponent(pL.href));
                    if (sR.ok) {
                        const subText = await sR.text();
                        if (subText && subText.length > 200) fD = subText;
                    }
                } catch (e) {}
            }

            const cH = btoa(unescape(encodeURIComponent(fD + sT))).substring(0, 32);

                wL = cH;
                const dateEl = document.getElementById('wdbos-date');
                if (dateEl) dateEl.innerText = sT;
                
                const sD = new DOMParser().parseFromString(fD, 'text/html');
                const cT = (t) => t.replace(/<[^>]*>?/gm, '').trim().replace(/\([nN]\)/g, '').replace(/\s*[\/\-]\s*\d+\s*$/, '').replace(/\s+/g, ' ').trim();
                const nT = (t) => t.trim().replace(/[\.\s]+/g, ':').replace(/(\d{2}):(\d{2})/, '$1:$2').trim();
                const gI = (n) => { const w = n.split(' '); return w.length > 1 ? (w[0][0].toUpperCase() + w[1][0].toUpperCase()) : n.substring(0, 2).toUpperCase(); };
                const cD = (d) => d.replace(/WIB/gi, '').trim();

                const matchReg = new Set();
                const leagueO = [];
                const leagueM = {};
                
                const tables = Array.from(sD.querySelectorAll('table')).filter(t => t.innerText.includes('VS'));
                tables.forEach(table => {
                    const rs = Array.from(table.querySelectorAll('tr'));
                    let cL = "JADWAL BOLA";
                    rs.forEach((r, i) => {
                        const cs = Array.from(r.querySelectorAll('td, th'));
                        if (cs.length === 3 && (cs[1].innerText.includes('VS') || cs[2].innerText.includes(':') || cs[2].innerText.includes('-'))) {
                            const time = cs[0].innerText.trim(), match = cs[1].innerText.trim(), score = cs[2].innerText.trim();
                            const teams = match.split(/\s+VS\s+/i).map(x => cT(x).toLowerCase()).sort();
                            const key = teams.join('|') + '@' + nT(time);
                            if (!matchReg.has(key)) {
                                matchReg.add(key);
                                if (!leagueM[cL]) { leagueM[cL] = []; leagueO.push(cL); }
                                const pX = match.split(/\s+VS\s+/i); 
                                if (pX.length >= 2) {
                                    const hX = cT(pX[0]), aX = cT(pX[1]);
                                    const mUI = '<div class="match-cell-content"><div class="team-wrapper home"><div class="team-icon">' + gI(hX) + '</div><span class="team-name">' + hX + '</span></div><span class="vs-badge">VS</span><div class="team-wrapper away"><div class="team-icon">' + gI(aX) + '</div><span class="team-name">' + aX + '</span></div></div>';
                                    const sUI = '<div class="score-container"><span class="score-box">?</span><span class="score-sep">:</span><span class="score-box">?</span></div>';
                                    leagueM[cL].push('<tr><td>' + cD(time) + '</td><td>' + mUI + '</td><td>' + sUI + '</td></tr>');
                                }
                            }
                        } else if (i === 0 || cs.length === 1) {
                            const tx = r.textContent.trim().toUpperCase();
                            if (tx.length > 5 && !tx.includes('BOLA')) cL = tx;
                        }
                    });
                });

                if (leagueO.length === 0) {
                    const lines = sD.body.innerHTML.replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '').split('\n');
                    let cL = "PREDIKSI BOLA";
                    const re = /(\d{1,2}\/\d{1,2}\s+\d{1,2}[:\.]\d{2})\s*(?:WIB)?\s+(.+?)\s+vs\s+(.+?)\s+([\d\/\.\s]+[:\-\u2013\u2014\s]+[\d\/\.]+)/i;
                    lines.forEach(line => {
                        const s = line.trim();
                        if (!s || s.length < 10) return;
                        const m = s.match(re);
                        if (m) {
                            const time = m[1].trim(), home = m[2].trim(), away = m[3].trim(), score = m[4].trim();
                            const key = [home.toLowerCase(), away.toLowerCase()].sort().join('|') + '@' + nT(time);
                            if (!matchReg.has(key)) {
                                matchReg.add(key);
                                if (!leagueM[cL]) { leagueM[cL] = []; leagueO.push(cL); }
                                const mUI = '<div class="match-cell-content"><div class="team-wrapper home"><div class="team-icon">' + gI(home) + '</div><span class="team-name">' + home + '</span></div><span class="vs-badge">VS</span><div class="team-wrapper away"><div class="team-icon">' + gI(away) + '</div><span class="team-name">' + away + '</span></div></div>';
                                const sUI = '<div class="score-container"><span class="score-box">?</span><span class="score-sep">:</span><span class="score-box">?</span></div>';
                                leagueM[cL].push('<tr><td>' + cD(time) + '</td><td>' + mUI + '</td><td>' + sUI + '</td></tr>');
                            }
                        } else if (s.length > 3 && s.length < 60 && !s.toLowerCase().includes('vs') && !s.toUpperCase().includes('BOLA') && !/\d{1,2}\/\d{1,2}/.test(s)) {
                            cL = s.toUpperCase();
                        }
                    });
                }

                let finalHtml = '';
                leagueO.forEach(name => {
                    finalHtml += '<table class="league-table"><thead><tr><th colspan="3" class="league-name-header"><div class="league-header-container"><span class="league-title-text"><i class="ph-fill ph-trophy"></i> '+name+'</span></div></th></tr><tr><th class="col-header date-col">Waktu</th><th class="col-header match-col">Pertandingan</th><th class="col-header score-col">Skor</th></tr></thead><tbody>' + leagueM[name].join('') + '</tbody></table>';
                });
                if(finalHtml) {
                    const contentEl = document.getElementById('wdbos-content');
                    if (contentEl) contentEl.innerHTML = finalHtml;
                }
            }
            return; // Sukses, keluar dari loop proxy
        } catch(e) {}
    }
}
